<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAMPEX</title>
    <link rel="icon" href="./assets/simbolo.jpeg" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegacao principal">
        <a class="brand" href="#live" aria-label="CAMPEX inicio">
          <img src="./assets/simbolo.jpeg" alt="" class="brand-mark" />
          <span>CAMPEX</span>
        </a>

        <nav class="nav-groups">
          <section class="nav-group" aria-labelledby="nav-operar">
            <h2 id="nav-operar">Operar</h2>
            <a href="#live" data-route="live">Ao vivo</a>
            <a href="#events" data-route="events">Eventos</a>
            <a href="#investigations" data-route="investigations">Investigações</a>
          </section>

          <section class="nav-group" aria-labelledby="nav-gerenciar">
            <h2 id="nav-gerenciar">Gerenciar</h2>
            <a href="#cameras" data-route="cameras">Câmeras</a>
            <a href="#zones" data-route="zones">Áreas & zonas</a>
            <a href="#rules" data-route="rules">Regras</a>
          </section>

          <section class="nav-group" aria-labelledby="nav-sistema">
            <h2 id="nav-sistema">Sistema</h2>
            <a href="#settings" data-route="settings">Configurações</a>
          </section>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sprint 1 / Camera Source</p>
            <h1 id="page-title">Ao vivo</h1>
          </div>
          <div class="connection" id="backend-status" data-state="checking" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text">Verificando backend</span>
          </div>
        </header>

        <section class="content-stage" id="app-view" aria-live="polite"></section>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
