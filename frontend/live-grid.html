<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campex Monitoramento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=campex-live-grid-20260729" />
  </head>
  <body class="campex-dashboard">
    <aside class="cx-sidebar">
      <div class="cx-sidebar-top">
        <a class="cx-logo" href="/operations-view" aria-label="Campex">
          <img src="/static/campex-logo-oficial.png" alt="Campex" />
          <strong>Campex</strong>
        </a>
        <button class="cx-collapse" type="button" aria-label="Recolher sidebar">‹</button>
      </div>
      <button class="cx-workspace-switcher" type="button" aria-label="Trocar workspace" title="Cliente piloto · Unidade principal">
        <span class="cx-workspace-initials">CP</span>
        <span class="cx-workspace-copy">
          <strong>Cliente piloto</strong>
          <small>Unidade principal</small>
        </span>
        <span class="cx-workspace-arrow">⌄</span>
      </button>
      <nav class="cx-nav cx-nav-grouped" aria-label="Navegação principal">
        <a href="/operations-view"><span class="cx-nav-icon" data-icon="operations"></span>Operations</a>
        <a href="/events"><span class="cx-nav-icon" data-icon="events"></span>Events</a>
        <a href="/insights"><span class="cx-nav-icon" data-icon="insights"></span>Intelligence</a>
        <a class="active" aria-current="page" title="Live" href="/live-grid"><span class="cx-nav-icon" data-icon="camera"></span>Live</a>
        <hr />
        <a href="/settings/cameras"><span class="cx-nav-icon" data-icon="settings"></span>Setup</a>
      </nav>
      <div class="cx-account">
        <a href="/help" class="cx-footer-link"><span class="cx-nav-icon" data-icon="help"></span>Ajuda</a>
        <a href="/settings/cameras" class="cx-footer-link"><span class="cx-nav-icon" data-icon="status"></span>Sistema online</a>
        <div class="cx-avatar">C</div>
        <div>
          <strong>Operador</strong>
          <span>Campex</span>
        </div>
      </div>
    </aside>
    <main class="cx-main app-content live-grid-shell">
      <header class="cx-header cx-topbar">
        <div>
          <p>Campex Operations</p>
          <h1>Live</h1>
        </div>
        <div class="cx-header-tools">
          <span id="gridResources" class="badge">Carregando setores</span>
          <a class="button-link" href="/settings/cameras">Abrir Setup</a>
        </div>
      </header>

      <section class="cx-live-grid-page">
        <div class="cx-panel-head">
          <div>
            <h2>Setores monitorados</h2>
            <p>Veja o que a Campex está observando agora, com foco no ativo, processo e evento físico atual.</p>
          </div>
        </div>
        <div id="gridCameraPicker" class="cx-grid-picker"></div>
        <div id="gridMessage" class="muted">Carregando câmeras cadastradas...</div>
        <section id="liveGrid" class="cx-live-grid"></section>
      </section>
    </main>
    <script src="/static/shell.js"></script>
    <script src="/static/live-grid.js"></script>
  </body>
</html>
